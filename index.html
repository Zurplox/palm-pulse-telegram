<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>📰 Brief Pagi</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#faf9f7;color:#1f2328;line-height:1.55}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:#6a737d;font-size:13px;margin-bottom:16px}
  .box{background:#fff;border:1px solid #e6e5e3;border-radius:12px;padding:14px 16px;margin:12px 0}
  h2{font-size:14px;margin:0 0 8px;color:#6a737d;text-transform:uppercase;letter-spacing:.04em}
  .mkt span{display:inline-block;margin:0 14px 6px 0;font-weight:600}
  .up{color:#1a7f37}.down{color:#b23c2b}
  ul{margin:0;padding-left:18px}li{margin:6px 0}
  a{color:#2E8B57;text-decoration:none}a:hover{text-decoration:underline}
  .ai{white-space:pre-wrap}
  .tbs span{display:inline-block;margin:0 14px 6px 0;font-weight:600}
  .note{color:#8a6d3b;font-size:12px;margin-top:6px}
  .rows div{margin:2px 0}
  .lbl{color:#6a737d;display:inline-block;min-width:96px}
</style>
</head>
<body><div class="wrap">
  <h1>📰 Brief Pagi</h1>
  <div class="sub" id="sub">memuat…</div>
  <div class="box" id="aiBox" style="display:none"><h2>Ringkasan AI</h2><div class="ai" id="ai"></div></div>
  <div class="box" id="tbsBox" style="display:none"><h2>Harga TBS (Palm Pulse)</h2>
    <div class="tbs" id="tbs"></div><ul id="palmPoints"></ul>
    <div class="note" id="palmNote"></div></div>
  <div class="box" id="cuacaBox" style="display:none"><h2>Cuaca kebun</h2>
    <div class="rows" id="cuaca"></div>
    <div class="note" id="cuacaNote"></div></div>
  <div class="box" id="lingBox" style="display:none"><h2>Banjir, karhutla &amp; udara</h2>
    <div class="rows" id="ling"></div></div>
  <div class="box"><h2>Pasar</h2><div class="mkt" id="mkt"></div></div>
  <div class="box"><h2>Berita sawit (Palm Pulse)</h2><ul id="news"></ul></div>
</div>
<script>
const AGES=["5","6","4","9"];
function num(v){const n=Number(v);return Number.isFinite(n)?n:null;}
function rupiah(v){const n=num(v);return n===null?null:'Rp'+Math.round(n).toLocaleString('id-ID');}
function priceOf(p){const a=p.age_prices_rp_per_kg||{};
  for(const k of AGES){if(num(a[k])!==null)return a[k];}
  return p.price_rp_per_kg;}
// Semua isi feed diperlakukan sebagai teks, tidak pernah sebagai HTML.
function row(parent,label,value){
  if(value===null||value===undefined||value==='')return;
  const d=document.createElement('div');
  const s=document.createElement('span');s.className='lbl';s.textContent=label;
  d.appendChild(s);d.appendChild(document.createTextNode(String(value)));
  parent.appendChild(d);}
fetch('data/brief.json?_='+Date.now()).then(r=>r.json()).then(b=>{
  document.getElementById('sub').textContent='Diperbarui '+(b.generated||'');
  if(b.ai_summary){document.getElementById('aiBox').style.display='';document.getElementById('ai').textContent=b.ai_summary;}

  const p=b.palm||{};const prices=(p.tbs_prices||[]).filter(x=>x&&typeof x==='object');
  let th='';
  prices.slice(0,3).forEach(x=>{const v=rupiah(priceOf(x));if(!v)return;
    const c=num(x.change_rp_per_kg);
    const cls=c>0?'up':(c<0?'down':'');
    const scheme=String(x.scheme||'TBS').replace(/[<>&]/g,'');
    const d=c?` <span class="${cls}">(${c>0?'naik':'turun'} ${rupiah(Math.abs(c))})</span>`:'';
    th+=`<span>${scheme}: ${v}/kg${d}</span>`;});
  if(th){document.getElementById('tbsBox').style.display='';
    document.getElementById('tbs').innerHTML=th;
    const pts=document.getElementById('palmPoints');pts.innerHTML='';
    (p.bullets||[]).forEach(t=>{const li=document.createElement('li');
      li.textContent=t;pts.appendChild(li);});
    if(p.edition)document.getElementById('palmNote').textContent='Edisi Palm Pulse: '+p.edition;}

  // Cuaca (feed kebun-sawit-cuaca, hanya dibaca)
  const c=b.cuaca||{};const t=(c.today&&typeof c.today==='object')?c.today:{};
  const cw=document.getElementById('cuaca');
  const cond=[t.emoji,t.condition].filter(Boolean).join(' ');
  row(cw,'Kondisi',cond);
  if(num(t.precip)!==null)row(cw,'Hujan',num(t.precip)+' mm'+(num(t.prob)!==null?' (peluang '+num(t.prob)+'%)':''));
  if(num(t.tmin)!==null&&num(t.tmax)!==null)row(cw,'Suhu',num(t.tmin)+'–'+num(t.tmax)+'°C');
  if(num(t.wind)!==null)row(cw,'Angin',[t.wind_dir,num(t.wind)+' km/jam'].filter(Boolean).join(' '));
  if(cw.children.length){document.getElementById('cuacaBox').style.display='';
    const note=[c.farm_name,c.updated_at?'diperbarui '+c.updated_at:''].filter(Boolean).join(' · ');
    document.getElementById('cuacaNote').textContent=note;}

  // Banjir / karhutla / udara
  const L=b.lingkungan||{};const lw=document.getElementById('ling');
  const fl=(L.flood&&typeof L.flood==='object')?L.flood:{};
  const fr=(L.fire&&typeof L.fire==='object')?L.fire:{};
  const ai=(L.air&&typeof L.air==='object')?L.air:{};
  if(fl.status||num(fl.river_discharge)!==null)
    row(lw,'Banjir',[fl.status||'-',num(fl.river_discharge)!==null?'debit '+num(fl.river_discharge)+' '+(fl.unit||''):'',fl.trend?'('+fl.trend+')':''].filter(Boolean).join(' · '));
  if(fr.status){const n=(fr.nearest&&typeof fr.nearest==='object')?fr.nearest:{};
    row(lw,'Karhutla',[fr.status,num(n.km)!==null?'titik terdekat '+num(n.km)+' km '+(n.dir||''):'',n.place||''].filter(Boolean).join(' · '));}
  if(num(ai.us_aqi)!==null||ai.category)
    row(lw,'Udara',[num(ai.us_aqi)!==null?'AQI '+num(ai.us_aqi):'',ai.category||'',ai.haze||''].filter(Boolean).join(', '));
  if(lw.children.length)document.getElementById('lingBox').style.display='';

  const m=b.markets||{};let mh='';
  (m.tickers||[]).forEach(t=>{const c=(t.pct>0?'up':(t.pct<0?'down':''));
    mh+=`<span class="${c}">${t.label}: ${t.last} (${t.pct>0?'+':''}${t.pct==null?'?':t.pct}%)</span>`;});
  (m.fx||[]).forEach(f=>{mh+=`<span>${f.pair}: ${f.rate}</span>`;});
  document.getElementById('mkt').innerHTML=mh||'(tidak ada data)';

  // Judul & sumber berasal dari feed pihak ketiga: sisipkan sebagai teks,
  // jangan sebagai HTML, dan hanya izinkan tautan http(s).
  const list=document.getElementById('news');list.innerHTML='';
  (b.news||[]).filter(n=>n&&n.title).forEach(n=>{
    const li=document.createElement('li');
    const safe=/^https?:\/\//i.test(n.link||'');
    const el=document.createElement(safe?'a':'span');
    if(safe){el.href=n.link;el.target='_blank';el.rel='noopener noreferrer';}
    el.textContent=n.title;li.appendChild(el);
    if(n.source){const s=document.createElement('small');
      s.textContent=' — '+n.source;li.appendChild(s);}
    list.appendChild(li);});
  if(!list.children.length)list.innerHTML='<li>(tidak ada berita)</li>';
}).catch(e=>{document.getElementById('sub').textContent='Gagal memuat: '+e;});
</script>
</body></html>
